<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>evo-dubbing</title>
    <link rel="stylesheet" href="./options.css" />
  </head>
  <body>
    <header class="evo-topbar">
      <div class="evo-topbar-inner">
        <div class="evo-brand">
          <span class="evo-logo" aria-hidden="true"></span>
          <span data-i18n="app.name">evo-dubbing</span>
          <span class="evo-brand-sep" aria-hidden="true">/</span>
          <span class="evo-brand-page" data-i18n="options.title"></span>
        </div>
        <div class="evo-topbar-actions">
          <span id="status" class="evo-save-state" role="status" aria-live="polite"></span>
          <button id="save" type="button" class="evo-btn evo-btn--solid" data-i18n="options.save"></button>
        </div>
      </div>
    </header>

    <main class="evo-page">
      <p class="evo-hint evo-lede" data-i18n="options.subtitle"></p>

      <section class="evo-card">
        <h2 class="evo-card-title" data-i18n="options.mode.heading"></h2>
        <div class="evo-choices">
          <label class="evo-choice">
            <input id="modeByok" type="radio" name="billingMode" value="byok" />
            <span class="evo-choice-body">
              <span class="evo-choice-title" data-i18n="options.mode.byok"></span>
              <span class="evo-choice-hint" data-i18n="options.mode.byokHint"></span>
            </span>
          </label>
          <label class="evo-choice">
            <input id="modeManaged" type="radio" name="billingMode" value="managed" />
            <span class="evo-choice-body">
              <span class="evo-choice-title" data-i18n="options.mode.managed"></span>
              <span class="evo-choice-hint" data-i18n="options.mode.managedHint"></span>
            </span>
          </label>
        </div>
      </section>

      <section class="evo-card">
        <h2 class="evo-card-title" data-i18n="options.managed.heading"></h2>
        <div class="evo-field">
          <label class="evo-label" for="managedBaseUrl" data-i18n="options.managed.baseUrl"></label>
          <input id="managedBaseUrl" class="evo-input" type="url" placeholder="https://managed.example.com" spellcheck="false" />
        </div>
        <div id="managedState" class="evo-managed"></div>
      </section>

      <section class="evo-card">
        <h2 class="evo-card-title" data-i18n="options.keys.heading"></h2>
        <p class="evo-hint" data-i18n="options.keys.hint"></p>
        <div class="evo-grid">
          <div class="evo-field">
            <label class="evo-label" for="openaiKey" data-i18n="options.keys.openai"></label>
            <input id="openaiKey" class="evo-input" type="password" placeholder="sk-..." autocomplete="off" spellcheck="false" />
          </div>
          <div class="evo-field">
            <label class="evo-label" for="geminiKey" data-i18n="options.keys.gemini"></label>
            <input id="geminiKey" class="evo-input" type="password" placeholder="AIza..." autocomplete="off" spellcheck="false" />
          </div>
        </div>
      </section>

      <section class="evo-card">
        <h2 class="evo-card-title" data-i18n="options.dubbing.heading"></h2>
        <div class="evo-grid">
          <div class="evo-field">
            <label class="evo-label" for="targetLang" data-i18n="options.dubbing.targetLang"></label>
            <div class="evo-select-wrap">
              <select id="targetLang" class="evo-select"></select>
              <span class="evo-i evo-i-chevron" aria-hidden="true"></span>
            </div>
          </div>
          <div class="evo-field">
            <label class="evo-label" for="duckVolume" data-i18n="options.dubbing.duck"></label>
            <input id="duckVolume" class="evo-range" type="range" min="0" max="0.6" step="0.02" />
            <small id="duckValue" class="evo-hint evo-num"></small>
          </div>
        </div>

        <hr class="evo-divider" />

        <div class="evo-grid">
          <div class="evo-field">
            <label class="evo-label" for="translateProvider" data-i18n="options.dubbing.translateProvider"></label>
            <div class="evo-select-wrap">
              <select id="translateProvider" class="evo-select"></select>
              <span class="evo-i evo-i-chevron" aria-hidden="true"></span>
            </div>
          </div>
          <div class="evo-field">
            <label class="evo-label" for="translateModel" data-i18n="options.dubbing.translateModel"></label>
            <div class="evo-select-wrap">
              <select id="translateModel" class="evo-select"></select>
              <span class="evo-i evo-i-chevron" aria-hidden="true"></span>
            </div>
          </div>
        </div>

        <div class="evo-grid">
          <div class="evo-field">
            <label class="evo-label" for="ttsProvider" data-i18n="options.dubbing.ttsProvider"></label>
            <div class="evo-select-wrap">
              <select id="ttsProvider" class="evo-select"></select>
              <span class="evo-i evo-i-chevron" aria-hidden="true"></span>
            </div>
          </div>
          <div class="evo-field">
            <label class="evo-label" for="ttsModel" data-i18n="options.dubbing.ttsModel"></label>
            <div class="evo-select-wrap">
              <select id="ttsModel" class="evo-select"></select>
              <span class="evo-i evo-i-chevron" aria-hidden="true"></span>
            </div>
          </div>
          <div class="evo-field">
            <label class="evo-label" for="voice" data-i18n="options.dubbing.voice"></label>
            <div class="evo-select-wrap">
              <select id="voice" class="evo-select"></select>
              <span class="evo-i evo-i-chevron" aria-hidden="true"></span>
            </div>
          </div>
        </div>

        <hr class="evo-divider" />

        <div class="evo-grid">
          <div class="evo-field">
            <label class="evo-label" for="sttProvider" data-i18n="options.dubbing.sttProvider"></label>
            <div class="evo-select-wrap">
              <select id="sttProvider" class="evo-select"></select>
              <span class="evo-i evo-i-chevron" aria-hidden="true"></span>
            </div>
            <small class="evo-hint" data-i18n="options.dubbing.sttHint"></small>
          </div>
        </div>

        <label class="evo-check">
          <input id="showSubtitles" type="checkbox" />
          <span data-i18n="options.dubbing.subtitles"></span>
        </label>

        <div class="evo-field">
          <label class="evo-check">
            <input id="showTimelineProgress" type="checkbox" />
            <span data-i18n="options.dubbing.timeline"></span>
          </label>
          <small class="evo-hint" data-i18n="options.dubbing.timelineHint"></small>
        </div>

        <div class="evo-field">
          <label class="evo-check">
            <input id="holdUntilFirstDub" type="checkbox" />
            <span data-i18n="options.dubbing.hold"></span>
          </label>
          <small class="evo-hint" data-i18n="options.dubbing.holdHint"></small>
        </div>
      </section>

      <section class="evo-card">
        <h2 class="evo-card-title" data-i18n="options.sharing.heading"></h2>
        <div class="evo-field">
          <label class="evo-label" for="shareServerUrl" data-i18n="options.sharing.serverUrl"></label>
          <input id="shareServerUrl" class="evo-input" type="url" placeholder="https://your-server.example.com" spellcheck="false" />
          <small class="evo-hint" data-i18n="options.sharing.serverHint"></small>
        </div>
        <div class="evo-grid">
          <div class="evo-field">
            <label class="evo-label" for="defaultVisibility" data-i18n="options.sharing.visibility"></label>
            <div class="evo-select-wrap">
              <select id="defaultVisibility" class="evo-select">
                <option value="public" data-i18n="options.sharing.public"></option>
                <option value="private" data-i18n="options.sharing.private"></option>
              </select>
              <span class="evo-i evo-i-chevron" aria-hidden="true"></span>
            </div>
          </div>
        </div>
        <label class="evo-check">
          <input id="autoUpload" type="checkbox" />
          <span data-i18n="options.sharing.autoUpload"></span>
        </label>
      </section>
    </main>

    <script type="module" src="./options.ts"></script>
  </body>
</html>
