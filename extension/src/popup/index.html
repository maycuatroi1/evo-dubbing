<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>evo-dubbing</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <header class="evo-head">
      <span class="evo-logo" aria-hidden="true"></span>
      <h1 class="evo-brand" data-i18n="app.name">evo-dubbing</h1>
    </header>

    <main class="evo-body">
      <p class="evo-hint" data-i18n="popup.tagline"></p>

      <section class="evo-field">
        <h2 class="evo-label" data-i18n="popup.stateHeading"></h2>
        <dl class="evo-kv">
          <div class="evo-kv-row">
            <dt data-i18n="popup.mode"></dt>
            <dd id="modeState">-</dd>
          </div>
          <div class="evo-kv-row">
            <dt data-i18n="popup.targetLang"></dt>
            <dd id="langState">-</dd>
          </div>
          <div class="evo-kv-row">
            <dt data-i18n="popup.openaiKey"></dt>
            <dd id="openaiState">-</dd>
          </div>
          <div class="evo-kv-row">
            <dt data-i18n="popup.geminiKey"></dt>
            <dd id="geminiState">-</dd>
          </div>
          <div class="evo-kv-row">
            <dt data-i18n="popup.shareServer"></dt>
            <dd id="serverState">-</dd>
          </div>
        </dl>
      </section>

      <button id="openOptions" type="button" class="evo-btn evo-btn--solid evo-btn--block">
        <span class="evo-i evo-i-settings" aria-hidden="true"></span>
        <span data-i18n="popup.openSettings"></span>
      </button>
    </main>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
